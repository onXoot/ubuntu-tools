name: Build and Push GHCR Image

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 要求镜像名全小写；表达式不支持大小写转换函数，用 shell 转换后写入环境变量
      - name: Compute lowercase image ref
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          REF_LC="$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${REPO_LC}" >> "$GITHUB_ENV"
          echo "TAG=${REF_LC}" >> "$GITHUB_ENV"

      # node-v24.19.0-linux-x64 被 .gitignore 排除，需要先下载解压到构建上下文
      - name: Download and extract Node.js
        run: |
          curl -fsSL -o node.tar.xz https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz
          tar -xJf node.tar.xz
          rm node.tar.xz
          test -d node-v24.19.0-linux-x64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GITHUB_TOKEN 登录 GHCR 时，用户名必须是仓库属主
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
